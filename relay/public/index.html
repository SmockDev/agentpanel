<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<title>agentpanel</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0E0F12; --panel:#131417; --line:#26282E; --ink:#E7E4DB; --dim:#8A8D96;
    --run:#F0A030; --wait:#E04B36; --done:#4FA85F;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--mono);
    font-size:14px;line-height:1.4;overscroll-behavior:none;
    padding-top:env(safe-area-inset-top);
  }
  #app{display:flex;flex-direction:column;height:100dvh}

  header{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--line);
    background:var(--panel);flex:0 0 auto;
  }
  header b{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
  .spacer{flex:1}
  .conn{font-size:11px;color:var(--dim);letter-spacing:.06em}
  .conn.on{color:var(--done)}
  .conn.off{color:var(--wait)}

  button{
    font-family:var(--mono);font-size:13px;color:var(--ink);
    background:#1B1D22;border:1px solid var(--line);border-radius:0;
    padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  button:active{background:#24272E}
  button:focus-visible{outline:2px solid var(--run);outline-offset:1px}

  /* Session list, styled as a line status board: the point is to see at a glance
     which agent needs a human, so the lamp does the talking. */
  #list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:16px 14px;border:0;border-bottom:1px solid var(--line);
    background:transparent;
  }
  .lamp{width:9px;height:9px;flex:0 0 auto;background:var(--dim)}
  .lamp.run{background:var(--run)}
  .lamp.wait{background:var(--wait);animation:blink 1.1s steps(1,end) infinite}
  .lamp.done{background:var(--done)}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.lamp.wait{animation:none}}
  .meta{min-width:0;flex:1}
  .meta .name{font-weight:600}
  .meta .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .state.wait{color:var(--wait)}
  .empty{padding:48px 20px;text-align:center;color:var(--dim);font-size:13px}
  .empty code{color:var(--ink);display:block;margin-top:12px;font-size:12px}

  /* Terminal view */
  #term{flex:1;min-height:0;background:#0A0B0D;padding:6px 4px}
  #term .xterm{height:100%}
  #bar{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #keys{display:flex;gap:6px;padding:8px 8px 0;overflow-x:auto}
  #keys button{flex:0 0 auto;font-size:12px;padding:7px 11px;color:var(--dim)}
  #send{display:flex;gap:6px;padding:8px}
  #send input{
    flex:1;min-width:0;font-family:var(--mono);font-size:16px; /* 16px stops iOS zooming on focus */
    background:#0A0B0D;border:1px solid var(--line);border-radius:0;
    color:var(--ink);padding:10px;
  }
  #send input:focus{outline:none;border-color:var(--run)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <b id="title">agentpanel</b>
    <span class="spacer"></span>
    <span class="conn" id="conn">connecting</span>
    <button id="back" class="hidden">back</button>
  </header>

  <div id="list"><div class="empty">waiting for the relay</div></div>

  <div id="term" class="hidden"></div>
  <div id="bar" class="hidden">
    <div id="keys">
      <button data-k="\r">enter</button>
      <button data-k="\x1b">esc</button>
      <button data-k="\x03">ctrl-c</button>
      <button data-k="\x1b[A">up</button>
      <button data-k="\x1b[B">down</button>
      <button data-k="y\r">yes</button>
      <button data-k="n\r">no</button>
      <button data-k="\t">tab</button>
    </div>
    <div id="send">
      <input id="msg" placeholder="type, then send" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="go">send</button>
    </div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/app.js"></script>
</body>
</html>
